<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>SF shared-home search · public view</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2326382f'/%3E%3Ctext x='10' y='45' font-size='40' fill='%23f6f3ec' font-family='Georgia'%3Esf%3C/text%3E%3C/svg%3E">
<style>
:root{--paper:#f6f3ec;--ink:#1f2a24;--muted:#6b7369;--line:#d7d2c4;--accent:#b4562f}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:13px/1.4 "Avenir Next",Avenir,"Gill Sans","Trebuchet MS",Verdana,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);padding-top:max(8px,env(safe-area-inset-top))}
.bar b{font:normal 17px Georgia,"Iowan Old Style",Palatino,serif;letter-spacing:-.03em}
.bar span{font:11px "SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.bar a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;padding:8px 0;min-height:44px;display:inline-flex;align-items:center}
.bar a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
iframe{flex:1;width:100%;border:0;background:var(--paper);min-height:0}
noscript{display:block;padding:20px;text-align:center}
@media (max-width:480px){.bar span{display:none}}
</style>
</head>
<body>
<div class="bar">
  <div><b>sf</b><span>shared-home search · public view</span></div>
  <a href="https://housing-search.davidteju.dev/housing-search-ishaan/" rel="noopener noreferrer" target="_blank">Open full page ↗</a>
</div>
<iframe src="https://housing-search.davidteju.dev/housing-search-ishaan/" title="SF shared-home search: analytics and all listings" loading="eager" referrerpolicy="no-referrer" allow="" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
</body>
</html>
